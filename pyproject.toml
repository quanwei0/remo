[project]
name = "remo"
version = "0.1.0"
description = "ReMo / AdaReMo: budgeted dual-timescale self-improvement for LLM agents (refinement + memory)"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["openai>=2.48,<4", "tiktoken>=0.13"]

[project.optional-dependencies]
# Formula + AppWorld runners. appworld is pinned to the exact upstream revision the paper's runs used (0.1.4.dev0,
# May 2025; its app / test sources are git-lfs bundles, so `git lfs install` before `pip install`); it brings pydantic 2
# and httpx 0.27, and its typer 0.12 CLI breaks on click >= 8.2. The PyPI release 0.1.3.post1 is NOT equivalent
# (different app responses and unit tests) — see benchmarks/appworld/README.md.
agents = [
    "appworld @ git+https://github.com/stonybrooknlp/appworld.git@57253350edf00922f370a8c7dbe94f1a4d3ee456",
    "click<8.2",
    "jinja2>=3.1",
]
# FinanceGym runner (also: pip install -e third_party/finance_harness)
financegym = ["httpx>=0.28", "faiss-cpu>=1.15", "numpy>=2.5", "pydantic>=2.13", "requests>=2.34"]

[tool.setuptools.packages.find]
include = ["remo*", "benchmarks*"]
